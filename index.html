<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carlos &amp; Gabriela — Landing Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17150F;
  --paper:#F6F3EC;
  --paper-2:#E7E1D4;
  --white:#FCFAF5;
  --cobalt:#8B2F3D;
  --cobalt-dim:#F0E1E3;
  --mustard:#A9822E;
  --line:rgba(23,21,15,0.14);
  --line-strong:rgba(23,21,15,0.22);
  --muted:rgba(23,21,15,0.64);
  --faint:rgba(23,21,15,0.46);
  --radius:6px;
  --font-display:'Playfair Display', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
html[data-theme="dark"]{
  --ink:#F3EFE6;
  --paper:#171512;
  --paper-2:#231F1A;
  --white:#1E1B17;
  --cobalt:#E19AA6;
  --cobalt-dim:#3A2226;
  --mustard:#D9AF5C;
  --line:rgba(243,239,230,0.12);
  --line-strong:rgba(243,239,230,0.22);
  --muted:rgba(243,239,230,0.66);
  --faint:rgba(243,239,230,0.46);
}
html[data-theme="dark"] .lp{
  --lp-cream:#221A1B;
  --lp-cream-2:#2B2022;
  --lp-plum:#F6E9DE;
  --lp-rose:#E8919B;
  --lp-rose-soft:#8A4B52;
  --lp-line:rgba(246,233,222,0.14);
}
html[data-theme="dark"] .lp-avatar{background:linear-gradient(160deg,#4A3324,#8A4B52 120%)}
html,body{transition:background-color .35s ease, color .35s ease}
*{transition:background-color .25s ease, border-color .25s ease, color .25s ease}
.reveal,.case-card,.service-card,.lp-card,.lp-testi{transition:opacity .65s cubic-bezier(.2,.7,.2,1), transform .3s ease, background-color .25s ease, border-color .25s ease, box-shadow .25s ease}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-0.005em;line-height:1.12}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);display:flex;align-items:center;gap:.5rem}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}

/* reveal + keyframes */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s cubic-bezier(.2,.7,.2,1), transform .65s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}
@keyframes fadeInUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes markerPulse{0%{box-shadow:0 0 0 0 rgba(139,47,61,.35)}70%{box-shadow:0 0 0 8px rgba(139,47,61,0)}100%{box-shadow:0 0 0 0 rgba(139,47,61,0)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.001ms!important}.reveal{opacity:1;transform:none}}

/* corner frame marks */
.frame{position:relative}
.frame::before,.frame::after{content:"";position:absolute;width:13px;height:13px;border:1.5px solid var(--cobalt);opacity:.5;pointer-events:none}
.frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

/* buttons */
.btn{font-family:var(--font-mono);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding:.7rem 1.15rem;border-radius:var(--radius);display:inline-flex;align-items:center;gap:.5rem;transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;white-space:nowrap;font-weight:600;cursor:pointer}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--ink);color:var(--white);border:1px solid var(--ink)}
.btn-primary:hover{background:var(--cobalt);border-color:var(--cobalt);box-shadow:0 10px 24px -12px var(--cobalt)}
.btn-ghost{border:1px solid var(--line-strong);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--cobalt);color:var(--cobalt)}
.theme-toggle{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);
  background:var(--white);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .2s ease, transform .2s ease, background .2s ease;
  flex-shrink:0;
}
.theme-toggle:hover{border-color:var(--cobalt);transform:translateY(-1px)}
.theme-toggle svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}
html[data-theme="dark"] .theme-toggle .icon-moon{display:none}
html[data-theme="dark"] .theme-toggle .icon-sun{display:block}
.lp .theme-toggle{background:var(--lp-cream);border-color:var(--lp-line)}
.lp .theme-toggle svg{stroke:var(--lp-plum)}
.lp .theme-toggle:hover{border-color:var(--lp-rose)}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--paper) 86%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--cobalt);position:relative;flex-shrink:0;transition:transform .3s ease}
.brand-mark::after{content:"";position:absolute;inset:6px;border:2px solid var(--white);border-radius:2px}
.brand:hover .brand-mark{transform:rotate(45deg)}
.nav-links{display:flex;align-items:center;gap:1.75rem;list-style:none;font-size:.92rem;color:var(--muted)}
.nav-links a:hover{color:var(--ink)}
@media(max-width:760px){.nav-links{display:none}}

/* HERO */
.hero{padding:clamp(3rem,7vw,5.5rem) 0}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(2rem,5vw,4rem);align-items:center}
.hero h1{font-size:clamp(2.4rem,5vw,3.9rem);font-weight:600;line-height:1.08;margin:1.1rem 0 1.2rem}
.hero h1 em{font-style:italic;color:var(--cobalt)}
.hero .lead{font-size:1.05rem;color:var(--muted);max-width:40ch}
.hero-actions{display:flex;gap:.85rem;margin-top:1.75rem;flex-wrap:wrap}
.hero-anim>*{opacity:0;animation:fadeInUp .7s cubic-bezier(.2,.7,.2,1) forwards}
.hero-anim>*:nth-child(1){animation-delay:.05s}
.hero-anim>*:nth-child(2){animation-delay:.14s}
.hero-anim>*:nth-child(3){animation-delay:.24s}
.hero-anim>*:nth-child(4){animation-delay:.34s}
.hero-visual{opacity:0;animation:fadeInUp .85s cubic-bezier(.2,.7,.2,1) .3s forwards}

/* blueprint preview */
.bp{background:var(--white);border:1px solid var(--line-strong);border-radius:var(--radius);padding:.9rem;position:relative;aspect-ratio:4/3.1;display:flex;flex-direction:column;gap:.5rem;overflow:hidden}
.bp-top{display:flex;align-items:center;gap:.35rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.bp-dot{width:7px;height:7px;border-radius:50%;background:var(--paper-2)}
.bp-url{flex:1;height:7px;background:var(--line);border-radius:2px;margin-left:.4rem}
.bp-hero{border:1px dashed var(--line-strong);border-radius:4px;padding:.7rem;display:flex;flex-direction:column;gap:.4rem}
.bp-line{height:7px;background:rgba(27,31,38,0.16);border-radius:2px}
.w90{width:90%}.w70{width:70%}.w55{width:55%}.w45{width:45%}.w35{width:35%}
.bp-btn{width:34%;height:14px;background:var(--cobalt-dim);border:1px solid var(--cobalt);border-radius:2px;margin-top:.15rem}
.bp-row{display:flex;gap:.45rem;flex:1}
.bp-box{flex:1;border:1px solid var(--line-strong);border-radius:4px;background:rgba(27,31,38,0.03)}
.bp-strip{display:flex;gap:.4rem}
.bp-item{flex:1;border:1px solid var(--line-strong);border-radius:4px;padding:.4rem;display:flex;flex-direction:column;gap:.3rem}
.bp-swatch{height:20px;background:rgba(27,31,38,0.06);border:1px solid var(--line);border-radius:2px}
.bp-form{border:1px dashed var(--line-strong);border-radius:4px;padding:.55rem;display:flex;flex-direction:column;gap:.35rem}
.bp-fab{position:absolute;bottom:.7rem;right:.7rem;width:22px;height:22px;border-radius:50%;background:var(--cobalt);border:1px solid var(--white)}
.bp-tag{position:absolute;top:.6rem;right:.6rem;font-family:var(--font-mono);font-size:.55rem;letter-spacing:.06em;color:var(--mustard);border:1px solid var(--mustard);padding:.15rem .4rem;border-radius:2px}
.marker{position:absolute;width:19px;height:19px;border-radius:50%;background:var(--cobalt);color:var(--white);font-family:var(--font-mono);font-weight:600;font-size:.68rem;display:flex;align-items:center;justify-content:center;animation:markerPulse 2.6s ease-out infinite}
.marker.m2{animation-delay:.5s}.marker.m3{animation-delay:1s}

.hero-legend{margin-top:.8rem;display:flex;flex-direction:column;gap:.45rem;font-size:.84rem;color:var(--muted);list-style:none}
.hero-legend li{display:flex;gap:.55rem;align-items:flex-start}
.num-badge{flex-shrink:0;width:17px;height:17px;border-radius:50%;background:var(--cobalt);color:var(--white);font-family:var(--font-mono);font-weight:600;font-size:.65rem;display:flex;align-items:center;justify-content:center;margin-top:.12rem}

/* generic section */
section{padding:clamp(3rem,6vw,4.5rem) 0}
.section-head{max-width:48ch;margin-bottom:2.4rem}
.section-head h2{font-size:clamp(1.6rem,3vw,2.2rem);margin-top:.7rem}
.section-head p{color:var(--muted);margin-top:.75rem;font-size:.98rem}

/* SERVICES */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.service-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:1.7rem;transition:transform .2s ease, box-shadow .2s ease}
.service-card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -28px rgba(27,31,38,0.5)}
.service-card .idx{font-family:var(--font-mono);font-size:.75rem;color:var(--cobalt)}
.service-card h3{font-size:1.25rem;font-weight:600;margin-top:.8rem}
.service-card p{color:var(--muted);margin-top:.65rem;font-size:.92rem}

/* PROJECTS */
.concept-note{display:flex;gap:.7rem;align-items:flex-start;background:var(--cobalt-dim);border:1px solid rgba(139,47,61,0.22);border-radius:var(--radius);padding:1rem 1.15rem;margin-bottom:2rem;font-size:.9rem;color:var(--muted)}
.concept-note strong{color:var(--ink)}
.case-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(1.25rem,3vw,2rem);margin-bottom:1.5rem;display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:clamp(1.5rem,3vw,2.5rem)}
.case-fig{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.case-title{font-size:1.45rem;font-weight:600;margin-top:.4rem}
.case-block{margin-top:1rem}
.case-block .label{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mustard)}
.case-block p{margin-top:.35rem;font-size:.92rem;color:var(--muted)}
.legend-list{list-style:none;margin:.5rem 0 0;display:flex;flex-direction:column;gap:.45rem}
.legend-list li{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.preview-link{display:block;cursor:pointer}
.preview-link .bp{transition:border-color .2s ease, transform .2s ease}
.preview-link:hover .bp,.preview-link:focus-visible .bp{border-color:var(--cobalt);transform:translateY(-2px)}
.preview-hint{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.8rem;background:linear-gradient(to top, rgba(27,31,38,0.72), transparent 55%);opacity:0;transition:opacity .2s ease;border-radius:var(--radius)}
.preview-link:hover .preview-hint,.preview-link:focus-visible .preview-hint{opacity:1}
.preview-hint span{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--white);border:1px solid var(--white);padding:.4rem .8rem;border-radius:999px}
.case-foot{margin-top:1.3rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.case-status{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px dashed var(--line-strong);padding:.35rem .7rem;border-radius:999px}

/* PROCESS */
.process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem}
.step{border-top:1px solid var(--line-strong);padding-top:1rem}
.step .n{font-family:var(--font-mono);color:var(--cobalt);font-size:.85rem}
.step h3{font-size:1.02rem;margin-top:.55rem}
.step p{font-size:.86rem;color:var(--muted);margin-top:.5rem}

/* CTA */
.cta-box{background:var(--white);border:1px solid var(--line-strong);border-radius:var(--radius);padding:clamp(2rem,5vw,3.5rem);text-align:center}
.cta-box h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
.cta-box p{color:var(--muted);margin-top:.85rem;max-width:46ch;margin-inline:auto}
.cta-actions{display:flex;gap:.9rem;justify-content:center;margin-top:1.75rem;flex-wrap:wrap}

/* FOOTER — crédito da dupla */
footer{border-top:1px solid var(--line);padding:2.2rem 0}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.2rem}
.footer-credit{display:flex;flex-direction:column;gap:.25rem}
.footer-credit .made{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.footer-credit .names{font-family:var(--font-display);font-weight:700;font-size:1rem}
.footer-credit .names span{color:var(--cobalt)}
.footer-links{display:flex;gap:1.1rem;font-size:.78rem;color:var(--faint);font-family:var(--font-mono)}
.footer-links a:hover{color:var(--cobalt)}

/* ===== LANDING PAGE (Professora) ===== */
.lp{--lp-cream:#FBF3E7;--lp-cream-2:#F4E7D5;--lp-plum:#3A1F2B;--lp-rose:#D96B72;--lp-rose-soft:#E89AA0;--lp-line:rgba(58,31,43,0.14);background:var(--lp-cream);color:var(--lp-plum);font-family:'Work Sans',sans-serif}
.lp h1,.lp h2,.lp h3{font-family:'Fraunces',serif}
.demo-badge{position:fixed;top:14px;left:14px;z-index:60;background:var(--ink);color:var(--white);font-family:var(--font-mono);font-size:11px;padding:8px 13px;border-radius:30px;display:flex;align-items:center;gap:7px;box-shadow:0 10px 26px -12px rgba(0,0,0,0.5);transition:background .2s ease}
.demo-badge:hover{background:var(--cobalt)}
.lp-nav{padding:22px 0}
.lp-nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px}
.lp-logo{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:21px}
.lp-hero{padding:32px 0 76px;position:relative}
.lp-hero .wrap{display:grid;grid-template-columns:1fr 0.85fr;gap:50px;align-items:center;position:relative;z-index:2}
.lp-hero h1{font-size:clamp(32px,6vw,54px);font-weight:500;line-height:1.12;margin-bottom:20px}
.lp-hero h1 em{color:var(--lp-rose);font-style:italic}
.lp-hero p{font-size:16.5px;color:color-mix(in srgb, var(--lp-plum) 72%, transparent);max-width:460px;margin-bottom:28px}
.lp-hero-copy>*{opacity:0;animation:fadeInUp .75s cubic-bezier(.2,.7,.2,1) forwards}
.lp-hero-copy>*:nth-child(1){animation-delay:.05s}
.lp-hero-copy>*:nth-child(2){animation-delay:.16s}
.lp-hero-copy>*:nth-child(3){animation-delay:.28s}
.lp-hero-copy>*:nth-child(4){animation-delay:.40s}
.lp-avatar-wrap{display:flex;justify-content:center;position:relative;opacity:0;animation:fadeInUp .9s cubic-bezier(.2,.7,.2,1) .25s forwards}
.lp-avatar{width:100%;max-width:320px;aspect-ratio:1;border-radius:50% 50% 46% 54%/54% 46% 54% 46%;background:linear-gradient(160deg,#EBD3B6,#D96B72 120%);position:relative;animation:floaty 6s ease-in-out infinite}
.lp-avatar::before{content:"";position:absolute;inset:-18px;border:1px dashed var(--lp-rose-soft);border-radius:inherit;opacity:.6;animation:floaty 6s ease-in-out infinite reverse}
.lp-avatar::after{content:"\201C Speak with confidence \201D";font-family:'Fraunces',serif;font-style:italic;position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--lp-cream);border:1px solid var(--lp-line);padding:10px 18px;border-radius:30px;font-size:13px;white-space:nowrap;box-shadow:0 12px 26px -14px color-mix(in srgb, var(--lp-plum) 35%, transparent)}
.lp-blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;z-index:1}
.lp-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:30px;background:var(--lp-plum);color:var(--lp-cream);font-weight:600;font-size:14.5px;transition:transform .18s ease, background .18s ease, box-shadow .18s ease}
.lp-btn:hover{background:var(--lp-rose);transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--lp-rose)}
.lp-section{padding:60px 0}
.lp-section.alt{background:var(--lp-cream-2)}
.lp-eyebrow{font-family:'Fraunces',serif;font-style:italic;color:var(--lp-rose);font-size:15px;margin-bottom:8px}
.lp-section h2{font-size:clamp(23px,4vw,34px);font-weight:500;margin-bottom:36px;max-width:520px}
.lp-cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.lp-card{background:var(--lp-cream);border:1px solid var(--lp-line);border-radius:16px;padding:26px;transition:transform .22s ease, box-shadow .22s ease}
.lp-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px color-mix(in srgb, var(--lp-plum) 40%, transparent)}
.lp-section.alt .lp-card{background:var(--lp-cream)}
.lp-card h3{font-size:18px;font-weight:600;margin-bottom:10px}
.lp-card p{font-size:14px;color:color-mix(in srgb, var(--lp-plum) 70%, transparent)}
.lp-chips{display:flex;flex-wrap:wrap;gap:10px}
.lp-chip{background:var(--lp-cream);border:1px solid var(--lp-line);border-radius:30px;padding:10px 18px;font-size:13.5px;font-weight:500;transition:background .2s ease, color .2s ease}
.lp-chip:hover{background:var(--lp-plum);color:var(--lp-cream)}
.lp-testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.lp-testi{background:var(--lp-cream-2);border-radius:16px;padding:24px;transition:transform .22s ease}
.lp-testi:hover{transform:translateY(-4px)}
.lp-section.alt .lp-testi{background:var(--lp-cream)}
.lp-testi p{font-size:14px;font-style:italic;margin-bottom:14px;color:color-mix(in srgb, var(--lp-plum) 80%, transparent)}
.lp-testi .who{font-weight:600;font-size:13px}
.lp-final{background:var(--lp-plum);color:var(--lp-cream);border-radius:24px;margin:0 28px 56px;padding:60px 40px;text-align:center;position:relative;overflow:hidden}
.lp-final::before{content:"";position:absolute;width:280px;height:280px;background:radial-gradient(circle,var(--lp-rose),transparent 70%);top:-120px;right:-60px;opacity:.5}
.lp-final h2{color:var(--lp-cream);font-size:clamp(24px,4.5vw,38px);margin-bottom:14px;position:relative}
.lp-final p{color:rgba(251,243,231,0.75);margin-bottom:26px;position:relative}
.lp-final .lp-btn{background:var(--lp-cream);color:var(--lp-plum);position:relative}
.lp-final .lp-btn:hover{background:var(--lp-rose);color:var(--lp-cream)}
.lp-foot{padding:30px 0 40px;font-size:12px;color:color-mix(in srgb, var(--lp-plum) 55%, transparent);text-align:center}
.lp-foot strong{color:var(--lp-plum)}

/* DASHBOARD */
.dash{background:var(--white);min-height:100vh}
.dash-nav{border-bottom:1px solid var(--line);padding:18px 0}
.dash-nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dash-title{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.dash-body{padding:36px 0 60px}
.dash-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:40px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.dcard .n{font-family:var(--font-display);font-size:28px;font-weight:700}
.dcard .l{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.funnel{display:flex;align-items:stretch;gap:2px;margin-bottom:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.fstep{flex:1;background:var(--paper);padding:16px 14px;text-align:center}
.fstep .n{font-family:var(--font-display);font-weight:700;font-size:22px}
.fstep .l{font-size:11px;font-family:var(--font-mono);color:var(--muted);margin-top:2px}
.fstep .r{font-size:11px;color:var(--cobalt);margin-top:6px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:40px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--faint);font-weight:500}
.empty{color:var(--faint);font-size:13.5px;padding:20px 0}
.dash-body h3.sub{font-family:var(--font-mono);font-size:13px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr}
  .hero-visual{order:-1}
  .services-grid{grid-template-columns:1fr}
  .process-grid{grid-template-columns:1fr;gap:0}
  .step{border-top:none;border-left:1px solid var(--line-strong);padding:0 0 1.75rem 1.1rem;margin-left:.3rem}
  .lp-hero .wrap{grid-template-columns:1fr;gap:36px;text-align:center}
  .lp-hero-copy .lp-btn{align-self:center}
  .lp-hero p{margin-left:auto;margin-right:auto}
  .lp-avatar-wrap{order:-1}
  .lp-avatar{max-width:240px}
  .lp-cols3,.lp-testimonials{grid-template-columns:1fr}
  .lp-final{margin:0 20px 40px;padding:44px 24px}
  .dash-cards{grid-template-columns:repeat(2,1fr)}
  .funnel{flex-direction:column}
  footer .footer-inner{flex-direction:column;align-items:flex-start}
}
@media(max-width:860px){.case-card{grid-template-columns:1fr}}
@media(max-width:420px){.lp-avatar::after{font-size:11px;padding:8px 14px}}

const params = new URLSearchParams(location.search);
const campaign = {
  utm_source: params.get('utm_source') || null,
  utm_medium: params.get('utm_medium') || null,
  utm_campaign: params.get('utm_campaign') || null,
};
const sessionId = 'sess_' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
const seenProjects = new Set();

async function track(type, projectId){
  const event = { type, projectId: projectId||null, timestamp: Date.now(), session: sessionId, ...campaign };
  try{
    const key = 'events:' + event.timestamp + '_' + Math.random().toString(36).slice(2,8);
    await window.storage.set(key, JSON.stringify(event), true);
  }catch(e){ console.error('tracking error', e); }
}
function go(hash){ location.hash = hash; }
function scrollToId(id){ var el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }

/* ---------- tema claro/escuro ---------- */
async function initTheme(){
  let theme = null;
  try{
    const r = await window.storage.get('theme-preference', false);
    if(r && r.value) theme = r.value;
  }catch(e){}
  if(!theme){
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
}
async function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ await window.storage.set('theme-preference', next, false); }catch(e){}
}

         <div class="bp">${previewInner(c.preview)}<div class="preview-hint"><span>Ver landing page →</span></div></div>
       </a>`
    : `<div class="frame case-track" data-project="${id}"><div class="bp">${previewInner(c.preview)}</div></div>`;

    ? `<div class="case-foot"><button type="button" class="btn btn-ghost" onclick="go('#/landing/${id}')">Ver landing page →</button></div>`

}

const EVENT_ORDER = ['portfolio_view','project_view','landing_page_view','contact_click'];
const EVENT_LABEL = {portfolio_view:'Portfólio', project_view:'Case visto', landing_page_view:'Landing page', contact_click:'Contato'};

async function renderDashboardInto(){
  const root = document.getElementById('dash-root');
  root.innerHTML = `<div class="empty">Carregando eventos…</div>`;
  let events = [];
  try{
    const list = await window.storage.list('events:', true);
    const keys = (list && list.keys) || [];
    for(const k of keys){
      try{ const r = await window.storage.get(k, true); if(r && r.value) events.push(JSON.parse(r.value)); }catch(e){}
    }
  }catch(e){
    root.innerHTML = `<div class="empty">Nenhum evento registrado ainda. Navegue pelo <a href="#/" style="color:var(--cobalt)">portfólio</a> para gerar dados.</div>`;
    return;
  }
  if(events.length === 0){
    root.innerHTML = `<div class="empty">Nenhum evento registrado ainda. Volte ao <a href="#/" style="color:var(--cobalt)">portfólio</a> e navegue pelos cases para ver o funil se preencher.</div>`;
    return;
  }

  const sessionsByStep = {}; EVENT_ORDER.forEach(t=>sessionsByStep[t]=new Set());
  const byProject = {}, byCampaign = {};
  events.forEach(e=>{
    if(sessionsByStep[e.type]) sessionsByStep[e.type].add(e.session);
    if(e.projectId){
      byProject[e.projectId] = byProject[e.projectId] || {views:0,contacts:0};
      if(e.type==='project_view'||e.type==='landing_page_view') byProject[e.projectId].views++;
      if(e.type==='contact_click') byProject[e.projectId].contacts++;
    }
    const camp = e.utm_campaign || '(acesso direto / sem campanha)';
    byCampaign[camp] = byCampaign[camp] || {reached:new Set(),contacts:new Set()};
    if(e.type==='portfolio_view') byCampaign[camp].reached.add(e.session);
    if(e.type==='contact_click') byCampaign[camp].contacts.add(e.session);
  });

  const counts = EVENT_ORDER.map(t=>sessionsByStep[t].size);
  const totalSessions = new Set(events.map(e=>e.session)).size;
  const overallConv = counts[0]>0 ? ((counts[3]/counts[0])*100).toFixed(1) : '0.0';

  const cards = `<div class="dash-cards">
    <div class="dcard"><div class="n">${totalSessions}</div><div class="l">Sessões totais</div></div>
    <div class="dcard"><div class="n">${counts[0]}</div><div class="l">Acessos ao portfólio</div></div>
    <div class="dcard"><div class="n">${counts[3]}</div><div class="l">Cliques em contato</div></div>
    <div class="dcard"><div class="n">${overallConv}%</div><div class="l">Conversão geral</div></div>
  </div>`;
  const funnel = `<div class="funnel">${EVENT_ORDER.map((t,i)=>{
    const rate = i===0?null:(counts[i-1]>0?((counts[i]/counts[i-1])*100).toFixed(0)+'% da etapa anterior':'—');
    return `<div class="fstep"><div class="n">${counts[i]}</div><div class="l">${EVENT_LABEL[t]}</div>${rate?`<div class="r">${rate}</div>`:''}</div>`;
  }).join('')}</div>`;
  const projectRows = Object.entries(byProject).map(([id,v])=>{
    const name=(CASES[id]&&CASES[id].title)||id;
    const rate=v.views>0?((v.contacts/v.views)*100).toFixed(1)+'%':'—';
    return `<tr><td>${name}</td><td>${v.views}</td><td>${v.contacts}</td><td>${rate}</td></tr>`;
  }).join('') || `<tr><td colspan="4" class="empty">Sem visualizações de projeto ainda</td></tr>`;
  const campaignRows = Object.entries(byCampaign).map(([camp,v])=>{
    const rate=v.reached.size>0?((v.contacts.size/v.reached.size)*100).toFixed(1)+'%':'—';
    return `<tr><td>${camp}</td><td>${v.reached.size}</td><td>${v.contacts.size}</td><td>${rate}</td></tr>`;
  }).join('');

  root.innerHTML = `
    ${cards}
    <h3 class="sub">Funil de conversão</h3>${funnel}
    <h3 class="sub">Desempenho por projeto</h3>
    <table><thead><tr><th>Projeto</th><th>Visualizações</th><th>Cliques em contato</th><th>Conversão</th></tr></thead><tbody>${projectRows}</tbody></table>
    <h3 class="sub">Desempenho por campanha (UTM)</h3>
    <table><thead><tr><th>Campanha</th><th>Alcançados</th><th>Contatos</th><th>Conversão</th></tr></thead><tbody>${campaignRows}</tbody></table>
    <p style="font-size:12px;color:var(--faint);margin-top:-10px">Dados anônimos (sessão sem identificação pessoal). Painel de uso interno da Rebeca.</p>`;
}
function renderDashboard(){
  setTimeout(renderDashboardInto,0);
  return `<div class="dash">
    <div class="dash-nav"><div class="wrap">
      <a href="#/" class="brand" style="font-size:.95rem"><span class="brand-mark"></span>Portfólio</a>
      <div class="dash-title">Painel de divulgação — uso interno (Rebeca)</div>
    </div></div>
    <div class="dash-body wrap" id="dash-root"></div>
  </div>`;
}

/* ---------- observers ---------- */
function initReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }});
  },{threshold:0.12, rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>io.observe(e));
}
/* fire project_view quando um case entra na tela (uma vez por sessão) */
function initProjectTracking(){
  const cards = document.querySelectorAll('.case-track');
  if(!cards.length) return;
  if(!('IntersectionObserver' in window)){ cards.forEach(c=>{const id=c.dataset.project; if(!seenProjects.has(id)){seenProjects.add(id);track('project_view',id);}}); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const id = en.target.dataset.project;
        if(id && !seenProjects.has(id)){ seenProjects.add(id); track('project_view', id); }
        io.unobserve(en.target);
      }
    });
  },{threshold:0.4});
  cards.forEach(c=>io.observe(c));
}

/* ---------- router ---------- */
function render(){
  const hash = location.hash.replace('#','').split('?')[0];
  const app = document.getElementById('app');
  window.scrollTo(0,0);
  if(hash.startsWith('/landing/')){
    const id = hash.split('/landing/')[1];
    app.innerHTML = renderLanding(); track('landing_page_view', id);
  } else if(hash.startsWith('/dashboard')){
    app.innerHTML = renderDashboard();
  } else {
    app.innerHTML = renderHome(); track('portfolio_view', null);
    requestAnimationFrame(initProjectTracking);
  }
  requestAnimationFrame(initReveal);
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', async () => { await initTheme(); render(); });
</script>
